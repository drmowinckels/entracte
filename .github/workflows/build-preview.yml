name: Build preview installers

# Produces runnable installers (.AppImage/.deb/.rpm, .msi/.exe, .dmg/.app)
# as downloadable workflow artifacts so changes can be tested on real
# Windows and Linux machines (or VMs) *before* cutting a release tag.
# Development happens on macOS, so this is the only way to exercise the
# per-OS surface (IPC transport, tray, overlay always-on-top, DnD/camera
# detection, autostart) without waiting for a release.
#
# Cost control: full Tauri bundles on three runners are expensive, so this
# never runs automatically on every PR. Two opt-in triggers only:
#   * Manual    — Actions tab → "Build preview installers" → Run workflow.
#   * PR label  — add the `build:installers` label to a PR; pushes to that
#                 PR then rebuild until the label is removed.
#
# Artifacts are debug builds (faster to compile, fine for behaviour
# testing) and are NOT signed — Gatekeeper/SmartScreen will warn, same as
# any unsigned local build. Updater artifact signing is disabled via a
# config override so no signing secret is required (works on forks too).
on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, reopened]

concurrency:
  group: build-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Manual runs always build. PR runs build only while the opt-in label
    # is present — `synchronize`/`reopened` re-evaluate the current label
    # set, so removing the label stops further preview builds.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'build:installers')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macos-aarch64
          - platform: ubuntu-22.04
            label: linux-x86_64
          - platform: windows-latest
            label: windows-x86_64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxss-dev libasound2-dev rpm squashfs-tools

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # `--debug` skips the LTO/codegen-units=1 release profile so the
      # build finishes in a fraction of the time. The `--config` override
      # turns off `createUpdaterArtifacts` (set in tauri.conf.json) so the
      # build doesn't demand TAURI_SIGNING_PRIVATE_KEY — preview installs
      # don't go through the in-app updater. `shell: bash` is forced so the
      # single-quoted JSON parses identically on the Windows runner.
      - name: Build debug installers
        shell: bash
        env:
          # Linux only: build deb + appimage, NOT rpm. Bundling the rpm from
          # an unstripped DEBUG binary took 2h44m in run 36894026697
          # (`Bundling ...rpm` 17:12:39 -> next line 19:56:42), which made
          # this job useless for checking the AppImage and cost several
          # cancelled runs before anyone measured it. Release builds are
          # unaffected — the release profile's rpm takes ~27s — so rpm
          # coverage still happens in release.yml, where it matters.
          BUNDLES: ${{ matrix.platform == 'ubuntu-22.04' && 'deb,appimage' || '' }}
        run: |
          args=(--debug --config '{"bundle":{"createUpdaterArtifacts":false}}')
          if [ -n "$BUNDLES" ]; then
            args+=(--bundles "$BUNDLES")
          fi
          npm run tauri build -- "${args[@]}"

      # `find -printf` is GNU-only, so this stays portable (the macOS
      # runner ships BSD find): list matching files, then basename each.
      - name: List built bundles
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.label }}"
            echo ""
            echo '```'
            find src-tauri/target/debug/bundle -type f \
              \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
                 -o -name '*.dmg' -o -name '*.msi' -o -name '*.exe' \) \
              2>/dev/null | while read -r f; do basename "$f"; done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Guard the Scoop portable zip (#359). The release job packages it with
      # pwsh, which `audit:workflow-shell` cannot check (it parses bash only),
      # so a wrong exe path or an empty archive would otherwise first surface
      # at release time, with the Windows bundles already built. Same class of
      # bug as the AppImage icon below: invisible unless something looks inside
      # the archive.
      #
      # This job is opt-in (`build:installers`), so this is a pre-release
      # smoke test to run when the packaging changes — not a per-PR gate.
      #
      # `--debug` here, so the exe is under target/debug.
      - name: Verify the portable zip can be packaged
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'portable-check'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item src-tauri/target/debug/entracte.exe (Join-Path $stage 'Entracte.exe')
          Copy-Item LICENSE $stage
          Copy-Item NOTICE $stage
          $zip = Join-Path $env:RUNNER_TEMP 'portable-check.zip'
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try { $names = $archive.Entries.FullName } finally { $archive.Dispose() }
          Write-Output "portable zip contents: $($names -join ', ')"
          # `-cnotcontains`, not `-notcontains`: PowerShell's default string
          # comparison is case-INsensitive, so `-notcontains` would accept an
          # `entracte.exe` that never got renamed and pass on exactly the bug
          # this step exists to catch.
          if ($names -cnotcontains 'Entracte.exe') {
            throw "no Entracte.exe at the zip root - the Scoop manifest bin/shortcuts would break"
          }
          if ($names -cnotcontains 'NOTICE') {
            throw "no NOTICE at the zip root - Apache-2.0 4(d) requires it in a redistribution"
          }

      # Guard the AppImage's required AppDir files. tauri-bundler < 2.9.4
      # wrote `.DirIcon` and the `.desktop` entry as ABSOLUTE symlinks
      # pointing into the build machine's AppDir, so once the AppImage is
      # mounted at /tmp/.mount_XXXX they dangle and read as missing. The
      # AppImage catalog rejected us for exactly that
      # (appimage.github.io#9123: "FATAL: .DirIcon is missing"), and it is
      # invisible unless something looks inside the bundle — nothing in CI
      # did. Runs here because this is the only job that builds an AppImage.
      - name: Verify AppImage AppDir files
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          appimage=$(find src-tauri/target/debug/bundle -name '*.AppImage' -type f | head -1)
          if [ -z "$appimage" ]; then
            echo "::error::no .AppImage found to verify"
            exit 1
          fi
          echo "verifying $(basename "$appimage")"

          # Absolute, because the extract runs from a scratch directory and
          # $OLDPWD is only defined after a cd — referencing it outside that
          # subshell trips `set -u`.
          appimage_abs="$PWD/$appimage"

          workdir=$(mktemp -d)
          chmod +x "$appimage_abs"
          ( cd "$workdir" && "$appimage_abs" --appimage-extract >/dev/null )
          root="$workdir/squashfs-root"

          fail=0
          for entry in .DirIcon *.desktop; do
            # shellcheck disable=SC2231
            for path in "$root"/$entry; do
              name=$(basename "$path")
              target=""
              if [ ! -e "$path" ] && [ ! -L "$path" ]; then
                echo "::error::$name is absent from the AppDir"
                fail=1
                continue
              fi
              if [ -L "$path" ]; then
                target=$(readlink "$path")
                case "$target" in
                  /*)
                    echo "::error::$name is an ABSOLUTE symlink -> $target (dangles once mounted; needs tauri-bundler >= 2.9.4)"
                    fail=1
                    continue
                    ;;
                esac
              fi
              # -e follows the link, so this is the real "does it resolve" test
              if [ ! -e "$path" ]; then
                echo "::error::$name does not resolve inside the AppDir -> $(readlink "$path")"
                fail=1
                continue
              fi
              echo "ok: $name -> ${target:-<regular file>}"
            done
          done

          # Launcher permissions, read from the SQUASHFS METADATA rather
          # than from the extracted tree. `--appimage-extract` does not
          # faithfully reproduce stored directory modes, so asserting on the
          # extracted copy reports 143 `drwx------` directories that the
          # AppImage catalog traverses without complaint — a false positive
          # that masks the thing we actually care about.
          #
          # What we care about is tauri-apps/tauri#16155: the bundler wrote
          # the launcher 0o770, so `AppRun.wrapped` was -rwxrwx--- and the app
          # could not start when root mounts the image and another user runs
          # it (`firejail --appimage`, which is how the catalog tests). That
          # rejected 0.0.13 at appimage.github.io#9123.
          offset=$("$appimage_abs" --appimage-offset)
          modes=$(unsquashfs -o "$offset" -lls "$appimage_abs")

          # The launchers must be readable AND executable by everyone. These
          # sit at the AppDir root, so no directory traversal is involved.
          for launcher in AppRun AppRun.wrapped; do
            line=$(echo "$modes" | grep -E "squashfs-root/${launcher}$" || true)
            if [ -z "$line" ]; then
              echo "note: no ${launcher} in this bundle"
              continue
            fi
            perms=${line%% *}
            # perms looks like -rwxr-xr-x: chars 8 and 10 are the other bits.
            if [ "${perms:7:1}" = "r" ] && [ "${perms:9:1}" = "x" ]; then
              echo "ok: ${launcher} is ${perms}"
            else
              echo "::error::${launcher} is ${perms} — not world-readable+executable, so the app will not start from a root-mounted AppImage (see tauri-apps/tauri#16155)"
              fail=1
            fi
          done

          # Anything else that is not world-readable is reported but does not
          # fail the job: the catalog tolerates it today, and we have no
          # evidence it breaks a launch. Left visible so a real regression
          # here is not silent.
          hidden=$(echo "$modes" | grep -cE "^.[rwx-]{2}-------" || true)
          if [ "$hidden" -gt 0 ]; then
            echo "::warning::${hidden} of the AppDir's entries are not world-readable (not failing: the catalog traverses the image regardless)"
          fi

          rm -rf "$workdir"
          exit "$fail"

      # SHA-pinned to match release.yml's uploader. Bumped via dependabot.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.label }}
          path: src-tauri/target/debug/bundle/
          if-no-files-found: error
          retention-days: 14
